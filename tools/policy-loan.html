<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>保單借款抗損試算｜MOMO財商智庫</title>
  <meta name="description" content="輸入保單價值、已進場金額與借款本息，依抗損設定算出還可進場金額，以及還款或基金出場多少能回到目標水位。" />
  <meta name="theme-color" content="#f6f1e7" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&display=swap" />
  <style>
    :root {
      --bg: #f6f1e7; --surface: #fffdf8; --ink: #0c152a; --ink-2: #44506a; --muted: #7a8296;
      --line: #e4dccb; --gold: #a88a3d; --gold-soft: #d2c696; --gold-bg: #f1e8cf;
      --up: #e03f19; --dn: #208306; --warn: #b42318; --warn-bg: #fdecea; --ok-bg: #e9f5e4;
      --serif: 'Noto Serif TC', 'Songti TC', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.75; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
    header { display: flex; justify-content: space-between; align-items: center; height: 58px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    header a { text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: 14px; }
    h1 { font-family: var(--serif); font-size: clamp(26px, 5.5vw, 36px); margin: 26px 0 6px; }
    .sub { color: var(--ink-2); margin: 0 0 18px; }
    .grid { display: block; }
    @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .card h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 12px; }
    .card h2 small { font-family: var(--sans); font-weight: 600; font-size: 13px; color: var(--muted); margin-left: 6px; }
    label { display: block; font-weight: 700; font-size: 14.5px; margin: 12px 0 4px; }
    label span { font-weight: 500; color: var(--muted); font-size: 13px; }
    .in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .in:focus-within { outline: 2px solid var(--gold-soft); }
    .in input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; font: 700 18px var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; outline: none; }
    .in em { font-style: normal; color: var(--muted); padding-right: 12px; font-size: 14px; }
    .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
    .kv:last-child { border-bottom: 0; }
    .kv .k { color: var(--ink-2); font-size: 14.5px; }
    .kv .v { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; text-align: right; }
    .kv.big .v { font-family: var(--serif); font-size: 28px; color: var(--gold); }
    .bar { position: relative; height: 14px; border-radius: 999px; background: linear-gradient(90deg, #cfe8c4 0%, #f7e3a8 60%, #f5b5a6 85%, #e98f7c 100%); margin: 6px 0 22px; }
    .bar i { position: absolute; top: -5px; width: 4px; height: 24px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
    .bar i.after { background: var(--gold); }
    .bar b { position: absolute; top: 18px; font-size: 11.5px; color: var(--muted); transform: translateX(-50%); font-weight: 600; white-space: nowrap; }
    .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.7; }
    .msg.warn { background: var(--warn-bg); color: var(--warn); }
    .msg.ok { background: var(--ok-bg); color: var(--dn); }
    .msg.info { background: var(--gold-bg); color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    thead th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .hit { color: var(--warn); font-weight: 800; }
    .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; line-height: 1.7; }
    .formula { font-size: 13px; color: var(--ink-2); background: var(--gold-bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><a href="/MOMO_FinSphere/me/">← MOMO 專用工具</a><a href="/MOMO_FinSphere/">MOMO財商智庫</a></header>
    <h1>保單借款抗損試算</h1>
    <p class="sub">未進場的錢在貨幣帳戶、不會波動；抗損＝基金市值可承受的跌幅。</p>

    <div class="grid">
      <div>
        <section class="card">
          <h2>基本資料 <small>單位：元</small></h2>
          <label for="v">保單價值 <span>含貨幣帳戶與基金</span></label>
          <div class="in"><input id="v" type="text" inputmode="numeric" value="5,000,000" /><em>元</em></div>
          <label for="f">已進場基金金額 <span>目前在基金裡的市值</span></label>
          <div class="in"><input id="f" type="text" inputmode="numeric" value="3,000,000" /><em>元</em></div>
          <label for="l">保單借款本息</label>
          <div class="in"><input id="l" type="text" inputmode="numeric" value="2,000,000" /><em>元</em></div>
          <label for="d">抗損 <span>基金市值可承受的跌幅</span></label>
          <div class="in"><input id="d" type="number" inputmode="decimal" value="10" min="1" max="99" step="any" /><em>%</em></div>
          <input id="cut" type="hidden" value="90" />
          <input id="ref" type="hidden" value="60" />
        </section>

        <section class="card">
          <h2>目前水位</h2>
          <div class="kv"><span class="k">目前借款成數</span><span class="v" id="o-r">—</span></div>
          <div class="kv"><span class="k">貨幣帳戶（未進場）</span><span class="v" id="o-c">—</span></div>
          <div class="kv"><span class="k">基金再跌多少會斷頭</span><span class="v" id="o-dd">—</span></div>
          <div class="bar" id="bar"></div>
        </section>
      </div>

      <div>
        <section class="card">
          <h2>① 可進場金額 <small>貨幣帳戶轉入基金</small></h2>
          <div class="kv big"><span class="k">還可以進場</span><span class="v" id="e">—</span></div>
          <div class="kv"><span class="k">進場後基金可再跌</span><span class="v" id="e-dd">—</span></div>
          <div id="e-msg"></div>
        </section>

        <section class="card">
          <h2>② 降水位 <small>還款：先用貨幣帳戶，不夠再基金出場</small></h2>
          <div class="row2">
            <div>
              <label for="rp">還款金額</label>
              <div class="in"><input id="rp" type="text" inputmode="numeric" placeholder="輸入金額" /><em>元</em></div>
            </div>
            <div>
              <label for="rt">還款後借款成數</label>
              <div class="in"><input id="rt" type="number" inputmode="decimal" placeholder="輸入成數" min="0" step="any" /><em>%</em></div>
            </div>
          </div>
          <div class="kv"><span class="k">貨幣帳戶／基金出場</span><span class="v" id="rp-src">—</span></div>
          <div class="kv"><span class="k">還款後基金可再跌</span><span class="v" id="rp-dd">—</span></div>
          <div id="rp-msg"></div>
          <div class="formula" id="tg"></div>
        </section>
      </div>
    </div>

    <p class="note">斷頭線以借款成數 90% 計算；未計入利息增加、匯率與費用，實際規則以保險公司條款為準。僅供試算參考，不構成投資或借款建議。</p>
  </div>

  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var num = function (id) { var v = parseFloat(String($(id).value).replace(/,/g, '')); return isFinite(v) ? v : 0; };
    var yuan = function (x) { return (x < 0 ? '-' : '') + Math.round(Math.abs(x)).toLocaleString('zh-TW') + ' 元'; };
    var pc = function (x, dp) { return isFinite(x) ? (x * 100).toFixed(dp == null ? 1 : dp) + '%' : '—'; };
    var fmt = function (el) { var v = num(el.id); if (el.value !== '') el.value = Math.round(v).toLocaleString('zh-TW'); };
    var lastRepay = 'amt';
    function msg(el, cls, html) { $(el).innerHTML = html ? '<div class="msg ' + cls + '">' + html + '</div>' : ''; }
    // 基金再跌多少會斷頭：L = cut ×（V − F × x）
    function tol(V, F, L, cut) { if (L >= cut * V) return 0; if (F <= 0) return Infinity; return (V - L / cut) / F; }
    function tolTxt(t) { return t === 0 ? '已達斷頭線' : t >= 1 ? '基金歸零也不會斷頭' : pc(t); }

    function calc() {
      var V = num('v'), F = Math.min(num('f'), V), L = num('l'), d = num('d') / 100, cut = num('cut') / 100;
      var C = V - F, r = V > 0 ? L / V : NaN, tNow = tol(V, F, L, cut), tgt = cut * (1 - d);

      $('o-r').textContent = pc(r);
      $('o-c').textContent = yuan(C);
      $('o-dd').textContent = tolTxt(tNow);
      $('o-dd').className = 'v' + (tNow < d ? ' hit' : '');
      
      // ① 依抗損可進場的基金總額（只用貨幣帳戶，不再借款；轉入基金不改變借款成數）
      var Fmax = d > 0 ? (V - L / cut) / d : 0;
      var E = Math.min(C, Math.max(0, Fmax - F));
      var tE = tol(V, F + E, L, cut);
      $('e').textContent = yuan(E);
      $('e-dd').textContent = E > 0 ? tolTxt(tE) : tolTxt(tNow);
      if (E > 0 && E >= C) msg('e-msg', 'info', '貨幣帳戶可以全部進場，進場後基金仍可再跌 ' + tolTxt(tE) + '。');
      else if (E > 0) msg('e-msg', 'info', '再進場 <b>' + yuan(E) + '</b> 後，基金跌超過 <b>' + pc(d, 0) + '</b> 就會碰到斷頭線；貨幣帳戶還剩 ' + yuan(C - E) + '。');
      else msg('e-msg', 'warn', tNow < d ? '目前基金' + (tNow === 0 ? '已達斷頭線' : '只能再跌 ' + pc(tNow)) + '，低於抗損 ' + pc(d, 0) + '，不建議再進場。' : '貨幣帳戶沒有可進場的資金。');

      // ② 還款：貨幣帳戶先還，不夠再基金出場
      function after(R) { var x = Math.max(0, R - C); return { V: V - R, L: L - R, F: F - x, c: Math.min(R, C), x: x }; }
      var R;
      if (lastRepay === 'amt') {
        R = num('rp');
        $('rt').value = $('rp').value === '' ? '' : (V - R > 0 ? +(((L - R) / (V - R)) * 100).toFixed(2) : '');
      } else {
        var t = num('rt') / 100;                    // (L − R)/(V − R) = t
        R = t < 1 ? (L - t * V) / (1 - t) : 0;
        $('rp').value = $('rt').value === '' ? '' : Math.round(R).toLocaleString('zh-TW');
      }
      if ($('rp').value === '') { ['rp-src', 'rp-dd'].forEach(function (k) { $(k).textContent = '—'; }); msg('rp-msg'); }
      else if (R <= 0) { ['rp-src', 'rp-dd'].forEach(function (k) { $(k).textContent = '—'; }); msg('rp-msg', 'warn', '目標成數高於目前成數，不需要還款。'); }
      else if (R > L) { msg('rp-msg', 'warn', '還款金額超過借款本息。'); }
      else {
        var a = after(R), ta = tol(a.V, a.F, a.L, cut);
        $('rp-src').textContent = Math.round(a.c / 1e4).toLocaleString('zh-TW') + ' 萬／' + Math.round(a.x / 1e4).toLocaleString('zh-TW') + ' 萬'; $('rp-dd').textContent = tolTxt(ta);
        msg('rp-msg');
      }

      // 回到目標抗損需還款多少
      var k = 1 / cut - 1, Rt = (L / cut - V + F * d) / k;   // 只用貨幣帳戶
      if (Rt > C) Rt = (L / cut - V * (1 - d)) / (k + d);    // 貨幣帳戶不夠，加上基金出場
      if (tNow >= d) $('tg').innerHTML = (tNow >= 1 ? '目前基金歸零也不會斷頭' : '目前基金可再跌 ' + pc(tNow)) + '，已達抗損 ' + pc(d, 0) + '，不需要還款。';
      else { var at = after(Rt); $('tg').innerHTML = '回到抗損 ' + pc(d, 0) + '：需還款 <b>' + yuan(Rt) + '</b>' + (at.x > 0 ? '（含基金出場 ' + yuan(at.x) + '）' : '') + '。'; }

      // 水位條
      var pos = function (x) { return Math.max(0, Math.min(100, x * 100)); };
      $('bar').innerHTML = '<i style="left:' + pos(r) + '%"></i><b style="left:' + pos(r) + '%">目前 ' + pc(r, 0) + '</b><b style="left:' + pos(cut) + '%">斷頭 ' + pc(cut, 0) + '</b>';
    }

    ['v', 'f', 'l', 'rp'].forEach(function (id) { $(id).addEventListener('blur', function () { fmt(this); }); });
    ['v', 'f', 'l', 'd'].forEach(function (id) { $(id).addEventListener('input', calc); });
    $('rp').addEventListener('input', function () { lastRepay = 'amt'; calc(); });
    $('rt').addEventListener('input', function () { lastRepay = 'pct'; calc(); });
    calc();
  })();
  </script>
</body>
</html>
