<html lang="zh-TW">
<head>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card-2: #111c33; --line: #334155; --text: #f1f5f9; --text-2: #cbd5e1; --muted: #94a3b8; --dim: #64748b;
      --red: #ef4444; --yellow: #eab308; --green: #10b981; --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; font-weight: 800; margin: 4px 0 2px; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.7rem; }
    .subtitle { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
    .status-bar { text-align: center; font-size: .8rem; color: var(--dim); margin-bottom: 12px; min-height: 18px; }

    /* 摘要＋篩選（同一排，點了就篩選） */
    .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0 10px; margin: 0 -15px; padding-left: 15px; padding-right: 15px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; background: rgba(30,41,59,.85); color: var(--muted); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .chip b { font-variant-numeric: tabular-nums; margin-left: 4px; color: var(--text); }
    .chip.on { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
    .chip.on b { color: #0f172a; }
    .chip.hit { border-color: rgba(239,68,68,.6); } .chip.hit b { color: #f87171; }
    .chip.watch { border-color: rgba(234,179,8,.6); } .chip.watch b { color: #facc15; }
    .chip.on.hit b, .chip.on.watch b { color: #0f172a; }
    .row2 { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .search { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: .95rem; }
    .search:focus { outline: 2px solid rgba(59,130,246,.5); border-color: var(--blue); }
    .view-switch { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; }
    .view-btn { background: none; color: var(--muted); border: none; padding: 5px 12px; border-radius: 8px; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .view-btn.active { background: #e2e8f0; color: #0f172a; }

    #loading { text-align: center; margin-top: 50px; color: var(--muted); display: none; }
    .empty-state { text-align: center; padding: 40px; color: var(--dim); border-radius: 12px; border: 2px dashed var(--line); }

    /* 排行表 */
    .rank-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: auto; max-height: calc(100vh - 170px); }
    .rank-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .86rem; font-variant-numeric: tabular-nums; }
    .rank-table th { position: sticky; top: 0; z-index: 2; background: var(--card-2); color: var(--muted); font-weight: 700; padding: 10px 8px; text-align: right; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
    .rank-table th.grp { border-left: 1px solid var(--line); }
    .rank-table td.grp { border-left: 1px solid rgba(51,65,85,.6); }
    .rank-table th:first-child, .rank-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; }
    .rank-table th:first-child { z-index: 3; background: var(--card-2); }
    .rank-table th.sorted { color: var(--text); }
    .rank-table td { padding: 7px 8px; border-bottom: 1px solid rgba(51,65,85,.6); white-space: nowrap; text-align: right; }
    .rank-table tr:hover td { background: #24324a; }
    .rank-table tbody tr { cursor: pointer; }
    .rank-table tr.stale td { opacity: .5; }
    .rk-name { max-width: 240px; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0; font-weight: 600; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--green); }
    .dot.hit { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,.7); } .dot.watch { background: var(--yellow); }
    .rk-cell { position: relative; min-width: 78px; }
    .rk-bar { position: absolute; right: 0; top: 50%; height: 18px; transform: translateY(-50%); border-radius: 4px; opacity: .3; }
    .rk-val { position: relative; font-weight: 700; }
    .up { color: #f87171; } .down { color: #34d399; } .na { color: #475569; }
    .t-hit { color: #f87171; font-weight: 800; } .t-watch { color: #facc15; font-weight: 700; } .t-ok { color: var(--text-2); }
    .trend { font-size: .78rem; padding: 1px 7px; border-radius: 999px; border: 1px solid; }
    .trend.bull { color: #bbf7d0; border-color: #22c55e; } .trend.bear { color: #fecaca; border-color: #ef4444; } .trend.neutral { color: #facc15; border-color: #eab308; } .trend.none { color: var(--dim); border-color: var(--line); }
    .note { color: var(--dim); font-size: .75rem; padding: 10px 4px; line-height: 1.6; }

    /* 卡片 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .fund-card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--line); border-left: 4px solid var(--green); display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
    .fund-card.hit { border-left-color: var(--red); background: linear-gradient(135deg, rgba(239,68,68,.07), var(--card) 60%); }
    .fund-card.watch { border-left-color: var(--yellow); }
    .fund-card.stale { opacity: .55; }
    .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .fund-name { font-weight: 700; font-size: 1rem; line-height: 1.4; color: #e2e8f0; }

    .badge.hit { color: #f87171; border-color: #ef4444; } .badge.watch { color: #facc15; border-color: #eab308; } .badge.ok { color: #6ee7b7; border-color: #10b981; }
    .kv { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .kv .l { font-size: .72rem; color: var(--muted); display: block; }
    .kv .v { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .spark { width: 100%; height: 48px; display: block; }
    .stale-tag { font-size: .72rem; color: #fbbf24; }

    /* 浮動按鈕 */
    .fab-container { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 12px; z-index: 90; }
    .fab { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,.5); border: none; color: #fff; }
    .fab-refresh { background: var(--blue); } .fab-update { background: var(--red); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(5px); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--card); width: 92%; max-width: 640px; max-height: 90vh; border-radius: 18px; padding: 18px; border: 1px solid #475569; display: flex; flex-direction: column; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .modal-title { font-size: 1.1rem; font-weight: 800; }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 1.6rem; cursor: pointer; padding: 0 4px; }
    .m-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .m-item { background: rgba(255,255,255,.05); padding: 8px; border-radius: 10px; text-align: center; }
    .m-item .l { font-size: .74rem; color: var(--muted); display: block; }
    .m-item .v { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .m-item .s { font-size: .7rem; color: var(--dim); display: block; }
    .big-chart-box { height: 300px; margin-bottom: 12px; }
    .m-sec { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: .86rem; line-height: 1.7; color: var(--text-2); }
    .m-sec h4 { margin: 0 0 6px; font-size: .9rem; color: var(--text); display: flex; justify-content: space-between; gap: 8px; }
    .m-sec h4 small { color: var(--dim); font-weight: 500; font-size: .74rem; }
    .bt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .84rem; margin-top: 4px; }
    .bt th, .bt td { padding: 5px 6px; text-align: right; border-bottom: 1px solid rgba(51,65,85,.6); white-space: nowrap; }
    .bt th:first-child, .bt td:first-child { text-align: left; }
    .bt th { color: var(--muted); font-weight: 600; font-size: .76rem; }
    .chk { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .chk span small { color: var(--dim); margin-left: 4px; }
    .stab { font-weight: 800; } .stab.s3 { color: #34d399; } .stab.s2 { color: #facc15; } .stab.s1, .stab.s0 { color: var(--dim); }
    .meta-line { font-size: .74rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .m-desc { font-size: .82rem; color: var(--muted); line-height: 1.7; background: rgba(0,0,0,.2); padding: 12px; border-radius: 10px; border-left: 3px solid var(--blue); }
    .result-item { display: flex; justify-content: space-between; padding: 10px 12px; background: rgba(255,255,255,.03); border-radius: 8px; }
    .r-nav { font-weight: 800; color: var(--green); } .r-date { font-size: .75rem; color: var(--muted); display: block; text-align: right; }
    @media (max-width: 600px) { .rk-name { max-width: 140px; } .rk-cell { min-width: 66px; } .rank-table { font-size: .8rem; } .m-info { grid-template-columns: repeat(2, 1fr); } }

<body>
<div class="container">
  <h1>🎯 基金戰情室</h1>
  <p class="subtitle">近 1 年回撤監控・NAV 報酬排行</p>

  <div class="toolbar">
    <div class="chips" id="chips" role="tablist" aria-label="篩選"></div>

      <input id="search" class="search" type="search" placeholder="搜尋基金名稱…" autocomplete="off">
      <div class="view-switch" role="tablist" aria-label="檢視方式">
        <button class="view-btn" data-view="rank">排行</button>

  <div id="loading">📡 正在連線資料庫...</div>

</div>

<div class="fab-container">
  <button class="fab fab-update" id="btn-update" title="觸發後端更新">🚀</button>

<div id="detail-modal" class="modal-backdrop">

<div id="update-modal" class="modal-backdrop">

    <div class="modal-header"><div class="modal-title">🚀 更新結果</div><button class="btn-close" data-close="update-modal">×</button></div>
    <div id="update-msg" style="padding:10px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;margin-bottom:12px;color:#10b981;font-size:.9rem"></div>
    <div id="update-list" style="display:flex;flex-direction:column;gap:6px;overflow-y:auto"></div>
    <button data-close="update-modal" style="margin-top:16px;width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer">確認並刷新</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  // ▼ Google Apps Script 網址
  const API_URL = "https://script.google.com/macros/s/AKfycbwYVirIuGO475Kb63z4jTKKgSPINSqy9jM3wPaQPMfa0DXzpdDybCXpoiqfPmeveb7F0g/exec";

  // ▼ 監控設定（逐檔門檻請改 Google Sheet「監控門檻」分頁；讀不到時用這裡的預設）
  const HIGH_WINDOW = 250;                 // 近 1 年高點：最近 250 筆 NAV
  const DEFAULT_TH = { watch: -0.08, target: -0.15 };
  const LEVELS = 3;                        // 達標線 3 條：門檻 ×1、×2、×3（例：-15%、-30%、-45%）
  const CIRCLE = ['', '①', '②', '③'];
  const STALE_DAYS = 3;                    // 比最新一檔晚超過 3 天 → 資料過期
  const MA_LONG = 240, MA_SHORT = 60;
  const RET_PERIODS = [1, 3, 7, 14, 30];
  const EXCLUDE = ['006208', 'SPY'];
  const CACHE_KEY = 'fund_radar_v48';
  const TH_CACHE_KEY = 'fund_radar_th_v1';

  const $ = (id) => document.getElementById(id);
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (x, dp = 1, sign = true) => x == null || !isFinite(x) ? '—' : ((sign && x > 0 ? '+' : '') + (x * 100).toFixed(dp) + '%');
  const DAY = 86400000;

  let funds = [];
  let thresholds = { def: DEFAULT_TH, funds: {} };
  let rawCache = null;
  let state = {
    filter: 'ALL',
    q: '',
    view: ls.get('fund_radar_view') || 'rank',
    sort: { key: 'gap', dir: 1 }   // 預設：距離達標最近的排最前面
  };
  let bigChart = null;

  // ---------- 資料處理 ----------
  function sma(arr, n) {
    const out = new Array(arr.length).fill(null);
    let sum = 0;
    for (let i = 0; i < arr.length; i++) {
      sum += arr[i];
      if (i >= n) sum -= arr[i - n];
      if (i >= n - 1) out[i] = sum / n;
    }
    return out;
  }
  function rollingMax(arr, n) {
    const out = new Array(arr.length);
    for (let i = 0; i < arr.length; i++) {
      let m = -Infinity;
      for (let k = Math.max(0, i - n + 1); k <= i; k++) if (arr[k] > m) m = arr[k];
      out[i] = m;
    }
    return out;
  }
  function rsiSeries(vals, n) {
    const out = new Array(vals.length).fill(null);
    if (vals.length <= n) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= n; i++) { const d = vals[i] - vals[i - 1]; if (d > 0) g += d; else l -= d; }
    g /= n; l /= n;
    out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = n + 1; i < vals.length; i++) {
      const d = vals[i] - vals[i - 1];
      g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  }

  // 1. 歷史回測：過去跌破同一條線之後的表現（用交易筆數當時間：3 個月≈63、6 個月≈126、12 個月≈252）
  const BT_H = [[3, 63], [6, 126], [12, 252]];
  function backtest(vals, ddSeries, T) {
    const n = vals.length, ev = [];
    let armed = true;
    for (let i = 1; i < n; i++) {
      if (armed && ddSeries[i] <= T && ddSeries[i - 1] > T) { ev.push(i); armed = false; }
      if (!armed && ddSeries[i] > T * 0.5) armed = true;          // 回升到門檻一半以上，才算下一次
    }
    const done = ev.filter((i) => i + BT_H[0][1] < n);            // 至少走完 3 個月才列入統計
    const stats = BT_H.map(([m, h]) => {
      const r = done.filter((i) => i + h < n).map((i) => vals[i + h] / vals[i] - 1);
      return { m, n: r.length, up: r.filter((x) => x > 0).length, avg: r.length ? r.reduce((a, b) => a + b, 0) / r.length : null, min: r.length ? Math.min(...r) : null };
    });
    const drops = done.map((i) => { let lo = vals[i]; for (let k = i; k <= Math.min(n - 1, i + 252); k++) if (vals[k] < lo) lo = vals[k]; return lo / vals[i] - 1; });
    return {
      T, events: ev.length, done: done.length, ongoing: ev.length - done.length, stats,
      dropAvg: drops.length ? drops.reduce((a, b) => a + b, 0) / drops.length : null, dropMin: drops.length ? Math.min(...drops) : null,
      dates: done.map((i) => i)
    };
  }

  // 2. 止跌訊號
  function stabilization(vals) {
    const n = vals.length, last = vals[n - 1];
    const ma20 = n >= 20 ? vals.slice(-20).reduce((a, b) => a + b, 0) / 20 : null;
    const w = vals.slice(-60); let li = 0; w.forEach((v, i) => { if (v <= w[li]) li = i; });
    const low = w[li], since = w.length - 1 - li, reb = last / low - 1;
    const rsi = rsiSeries(vals, 14), cur = rsi[n - 1];
    const recent = rsi.slice(-20).filter((x) => x != null), rmin = recent.length ? Math.min(...recent) : null;
    const checks = [
      ['站上 20 日均線', ma20 != null && last > ma20, ma20 != null ? `均線 ${ma20.toFixed(2)}` : '資料不足'],
      ['距 60 日低點反彈 ≥ 3%', reb >= 0.03, `已反彈 ${pct(reb)}`],
      ['10 個交易日沒創新低', since >= 10, `低點後 ${since} 筆`],
      ['RSI 從 30 以下回升', rmin != null && rmin < 30 && cur > rmin + 5, cur != null ? `RSI ${cur.toFixed(0)}（近 20 筆最低 ${rmin.toFixed(0)}）` : '資料不足']
    ];
    return { score: checks.filter((c) => c[1]).length, checks, low, since, reb };
  }

  // 3. 大盤：用基準在「同一天」的近 1 年回撤
  let benches = [];
  function benchDD(b, ts) {
    let i = b.pts.length - 1; while (i >= 0 && b.pts[i].ts > ts) i--;
    if (i < 0) return null;
    let hi = 0; for (let k = Math.max(0, i - HIGH_WINDOW + 1); k <= i; k++) if (b.pts[k].v > hi) hi = b.pts[k].v;
    return { dd: b.pts[i].v / hi - 1, date: b.pts[i].date };
  }

  function thFor(name) {
    const t = thresholds.funds[name] || {};
    return { watch: t.watch != null ? t.watch : thresholds.def.watch, target: t.target != null ? t.target : thresholds.def.target, custom: !!thresholds.funds[name] };
  }

  function processData(headers, rows) {
    const clean = rows.map((r) => { const ts = Date.parse(String(r[0]).replace(/-/g, '/')); return isNaN(ts) ? null : { ts, date: r[0], r }; })
      .filter(Boolean).sort((a, b) => a.ts - b.ts);
    const list = [];
    benches = [];
    for (let i = 1; i < headers.length; i++) {
      const name = String(headers[i] || '').trim();
      if (!name) continue;
      const pts = [];
      clean.forEach((it) => { const v = parseFloat(it.r[i]); if (!isNaN(v) && v > 0) pts.push({ ts: it.ts, date: String(it.date).slice(0, 10), v }); });
      if (!pts.length) continue;
      if (EXCLUDE.some((x) => name.includes(x))) { benches.push({ name: EXCLUDE.find((x) => name.includes(x)), full: name, pts }); continue; }
      const vals = pts.map((p) => p.v);
      const last = pts[pts.length - 1];
      const win = pts.slice(-HIGH_WINDOW);
      const hi = win.reduce((a, b) => (b.v >= a.v ? b : a), win[0]);
      const dd = last.v / hi.v - 1;
      const ma240 = sma(vals, MA_LONG), ma60 = sma(vals, MA_SHORT);
      const maL = ma240[ma240.length - 1], maS = ma60[ma60.length - 1];
      const bias = maL ? last.v / maL - 1 : null;
      let trend = 'none';
      if (maL && maS) { const d = maS / maL - 1; trend = d >= 0.02 ? 'bull' : d <= -0.02 ? 'bear' : 'neutral'; }
      const rets = {};
      RET_PERIODS.forEach((n) => {
        rets[n] = null;
        const target = last.ts - n * DAY;
        for (let k = pts.length - 2; k >= 0; k--) if (pts[k].ts <= target) { rets[n] = last.v / pts[k].v - 1; break; }
      });
      const th = thFor(name);
      let level = 0;
      for (let L = LEVELS; L >= 1; L--) if (dd <= th.target * L) { level = L; break; }
      const status = level ? 'hit' : dd <= th.watch ? 'watch' : 'ok';
      const next = level < LEVELS ? th.target * (level + 1) : null;      // 下一條達標線
      const gap = next != null ? dd - next : dd - th.target * LEVELS;   // 距下一條線還差多少
      // 歷史位置＋回測＋止跌
      const rh = rollingMax(vals, HIGH_WINDOW), dds = vals.map((v, k) => v / rh[k] - 1);
      const pctl = dds.filter((x) => x <= dd + 1e-12).length / dds.length;     // 回撤這麼深（或更深）的日子占多少
      const maxDD = Math.min(...dds);
      const bt = backtest(vals, dds, level ? th.target * level : th.target);
      const stab = stabilization(vals);
      list.push({ name, pts, vals, last, hi, dd, bias, trend, ma240, ma60, rets, th, status, level, next, gap, short: pts.length < 30, pctl, maxDD, bt, stab, years: (last.ts - pts[0].ts) / (365 * DAY) });
    }
    const newest = Math.max(...list.map((f) => f.last.ts));
    list.forEach((f) => { f.lagDays = Math.round((newest - f.last.ts) / DAY); f.stale = f.lagDays > STALE_DAYS; });
    funds = list;
    return newest;
  }

  // ---------- 畫面 ----------
  const TREND_TXT = { bull: '多頭', bear: '空頭', neutral: '中性', none: '資料不足' };
  const STATUS_TXT = { hit: '已達標', watch: '觀察中', ok: '正常' };
  const stTxt = (f) => f.level ? `達標${CIRCLE[f.level]}` : STATUS_TXT[f.status];
  const pctlTxt = (f) => f.years < 1 ? '<span class="na">資料短</span>' : f.dd > -0.005 ? '<span class="na">—</span>' : f.pctl < 0.005 ? '<span class="t-hit">史上最深</span>' : `${Math.round(f.pctl * 100)}%`;
  const nextTxt = (f) => f.level >= LEVELS ? '已達第 3 條' : `${(f.gap * 100).toFixed(1)}%`;

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return funds.filter((f) => {
      if (q && !f.name.toLowerCase().includes(q)) return false;
      if (state.filter === 'HIT') return f.status === 'hit';
      if (state.filter === 'WATCH') return f.status === 'watch';
      if (state.filter === 'STALE') return f.stale;
      return true;
    });
  }

  function renderChips() {
    const n = (fn) => funds.filter(fn).length;
    const chips = [
      ['ALL', '全部', funds.length, ''],
      ['HIT', '🚨 已達標', n((f) => f.status === 'hit'), 'hit'],
      ['WATCH', '⚠️ 觀察中', n((f) => f.status === 'watch'), 'watch'],
      ['STALE', '⏳ 資料過期', n((f) => f.stale), '']
    ];
    $('chips').innerHTML = chips.map(([k, t, c, cls]) =>
      `<button class="chip ${cls} ${state.filter === k ? 'on' : ''}" data-f="${k}">${t}<b>${c}</b></button>`).join('');
  }

  function render() {
    renderChips();
    document.querySelectorAll('.view-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
    const box = $('dashboard');
    const list = filtered();
    if (!funds.length) return;
    if (!list.length) { box.className = ''; box.innerHTML = '<div class="empty-state">📭 沒有符合條件的基金</div>'; return; }
    if (state.view === 'card') renderCards(box, list); else renderRank(box, list);
  }

  function sortVal(f, k) {
    if (k === 'name') return f.name;
    if (k === 'dd') return f.dd;
    if (k === 'gap') return (LEVELS - f.level) * 10 + f.gap;   // 先依達標級數（高的在前），再依距下一條線
    if (k === 'bias') return f.bias;
    if (k === 'stab') return f.stab.score;
    if (k === 'pctl') return f.pctl;
    return f.rets[k];
  }

  function renderRank(box, list) {
    const { key, dir } = state.sort;
    const rows = list.slice().sort((a, b) => {
      const va = sortVal(a, key), vb = sortVal(b, key);
      if (key === 'name') return va.localeCompare(vb, 'zh-Hant') * dir;
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      return (va - vb) * dir;
    });
    const maxAbs = {};
    RET_PERIODS.forEach((n) => { maxAbs[n] = Math.max(0.0001, ...rows.map((f) => Math.abs(f.rets[n] || 0))); });
    const th = (k, label, cls = '') => `<th class="${cls} ${key === k ? 'sorted' : ''}" data-k="${k}">${label}${key === k ? (dir < 0 ? ' ▼' : ' ▲') : ''}</th>`;
    const head = '<tr>' + th('name', `基金（${rows.length}）`) + th('dd', '近 1 年回撤', 'grp') + th('gap', '距下一條線') + th('pctl', '歷史深度') + th('stab', '止跌') + th('bias', '年線乖離') +
      '<th>趨勢</th>' + RET_PERIODS.map((n, i) => th(n, n + ' 天', i === 0 ? 'grp' : '')).join('') + '</tr>';
    const body = rows.map((f, idx) => {
      const ddCls = f.status === 'hit' ? 't-hit' : f.status === 'watch' ? 't-watch' : 't-ok';
      const gapTxt = f.level >= LEVELS ? '<span class="t-hit">已達第 3 條</span>'
        : `<span class="t-ok">${(f.gap * 100).toFixed(1)}%</span><small style="display:block;color:var(--dim);font-size:.7rem">到${CIRCLE[f.level + 1]} ${pct(f.next, 0)}</small>`;
      const cells = RET_PERIODS.map((n, i) => {
        const v = f.rets[n];
        if (v == null) return `<td class="rk-cell ${i === 0 ? 'grp' : ''}"><span class="rk-val na">—</span></td>`;
        const w = Math.min(100, Math.abs(v) / maxAbs[n] * 100);
        return `<td class="rk-cell ${i === 0 ? 'grp' : ''}"><span class="rk-bar" style="width:${w}%;background:${v >= 0 ? '#ef4444' : '#10b981'}"></span><span class="rk-val ${v >= 0 ? 'up' : 'down'}">${pct(v, 2)}</span></td>`;
      }).join('');
      const sub = `NAV ${f.last.v}・${f.last.date}` + (f.stale ? `・晚 ${f.lagDays} 天` : '') + (f.th.custom ? '・自訂門檻' : '');
      return `<tr data-i="${idx}" class="${f.stale ? 'stale' : ''}"><td class="rk-name" title="${esc(f.name)}"><span class="dot ${f.status}"></span>${esc(f.name)}<small>${esc(sub)}</small></td>` +
        `<td class="grp ${ddCls}">${pct(f.dd)}${f.level ? ' ' + CIRCLE[f.level] : ''}</td><td>${gapTxt}</td><td>${pctlTxt(f)}</td><td><span class="stab s${f.stab.score}">${f.stab.score}/4</span></td><td>${f.bias == null ? '<span class="na">不足</span>' : pct(f.bias)}</td>` +
        `<td><span class="trend ${f.trend}">${TREND_TXT[f.trend]}</span></td>${cells}</tr>`;
    }).join('');
    box.className = '';
    box.innerHTML = `<div class="rank-wrap"><table class="rank-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>` +
      `<div class="note">● 紅＝已達標（①②③＝跌破第幾條達標線）、黃＝觀察中、綠＝正常。回撤＝最新 NAV 相對近 1 年（${HIGH_WINDOW} 筆）最高 NAV；預設觀察 ${pct(thresholds.def.watch, 0)}、達標線 ${pct(thresholds.def.target, 0)}／${pct(thresholds.def.target * 2, 0)}／${pct(thresholds.def.target * 3, 0)}，可在「監控門檻」分頁逐檔調整。` +
      `距下一條線＝回撤還差多少到下一條達標線。歷史深度＝歷史上回撤這麼深（或更深）的日子占多少，越小越少見。止跌＝4 項止跌條件成立幾項。報酬率以各基金最新 NAV 往回推 N 個日曆天計算，不含配息；比最新一檔晚超過 ${STALE_DAYS} 天的會反灰。點標題排序，點基金看詳情。</div>`;
    box.querySelectorAll('th[data-k]').forEach((h) => h.addEventListener('click', () => {
      const k = isNaN(+h.dataset.k) ? h.dataset.k : +h.dataset.k;
      if (state.sort.key === k) state.sort.dir *= -1;
      else state.sort = { key: k, dir: (k === 'name' || k === 'gap' || k === 'dd' || k === 'pctl') ? 1 : -1 };
      render();
    }));
    box.querySelectorAll('tbody tr').forEach((tr) => tr.addEventListener('click', () => openModal(rows[+tr.dataset.i])));
  }

  function sparkSvg(f) {
    const pts = f.vals.slice(-120);
    const nShow = Math.min(LEVELS, f.level + 1);                      // 畫到下一條線為止，避免圖被壓扁
    const lines = []; for (let L = 1; L <= nShow; L++) lines.push(f.hi.v * (1 + f.th.target * L));
    const lo = Math.min(...pts, ...lines), hi = Math.max(...pts);
    const W = 300, H = 48, pad = 3, span = (hi - lo) || 1;
    const y = (v) => (pad + (H - 2 * pad) * (1 - (v - lo) / span)).toFixed(1);
    const x = (i) => (pts.length < 2 ? 0 : (W * i / (pts.length - 1))).toFixed(1);
    const color = f.status === 'hit' ? '#ef4444' : f.status === 'watch' ? '#eab308' : '#60a5fa';
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">` +
      lines.map((v, i) => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#10b981" stroke-opacity="${1 - i * 0.25}" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`).join('') +
      `<path d="${pts.map((v, i) => (i ? 'L' : 'M') + x(i) + ',' + y(v)).join('')}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function renderCards(box, list) {
    const rows = list.slice().sort((a, b) => sortVal(a, 'gap') - sortVal(b, 'gap'));
    box.className = 'grid';
    box.innerHTML = rows.map((f, idx) => `
      <div class="fund-card ${f.status} ${f.stale ? 'stale' : ''}" data-i="${idx}">
        <div class="card-top"><div class="fund-name">${esc(f.name)}</div><span class="badge ${f.status}">${stTxt(f)}</span></div>
        <div class="kv">
          <div><span class="l">近 1 年回撤</span><span class="v ${f.status === 'hit' ? 't-hit' : f.status === 'watch' ? 't-watch' : ''}">${pct(f.dd)}</span></div>
          <div><span class="l">${f.level >= LEVELS ? '達標線' : `距${CIRCLE[f.level + 1]}（${pct(f.next, 0)}）`}</span><span class="v">${f.level >= LEVELS ? '③' : (f.gap * 100).toFixed(1) + '%'}</span></div>
          <div><span class="l">最新 NAV</span><span class="v">${f.last.v}</span></div>
        </div>
        ${sparkSvg(f)}
        <div class="meta-line"><span>止跌 <span class="stab s${f.stab.score}">${f.stab.score}/4</span></span>${f.dd <= -0.005 && f.years >= 1 ? `<span>歷史深度 ${f.pctl < 0.005 ? '史上最深' : Math.round(f.pctl * 100) + '%'}</span>` : ''}${f.bt.done ? `<span>回測 ${f.bt.done} 次・12 個月上漲 ${f.bt.stats[2].n ? f.bt.stats[2].up + '/' + f.bt.stats[2].n : '—'}</span>` : ''}</div>
        <div style="display:flex;justify-content:space-between;font-size:.74rem;color:var(--dim)"><span>近 120 筆・虛線＝達標線</span><span>${f.last.date}${f.stale ? ` <span class="stale-tag">晚 ${f.lagDays} 天</span>` : ''}</span></div>
      </div>`).join('');
    box.querySelectorAll('.fund-card').forEach((c) => c.addEventListener('click', () => openModal(rows[+c.dataset.i])));
  }

  // ---------- 詳情 ----------
  function openModal(f) {
    $('m-title').textContent = f.name;
    const item = (l, v, s, color) => `<div class="m-item"><span class="l">${l}</span><span class="v" style="${color ? 'color:' + color : ''}">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
    const stColor = f.status === 'hit' ? '#f87171' : f.status === 'watch' ? '#facc15' : '#6ee7b7';
    $('m-info').innerHTML =
      item('最新 NAV', f.last.v, f.last.date + (f.stale ? `（晚 ${f.lagDays} 天）` : '')) +
      item('近 1 年高點', f.hi.v, f.hi.date) +
      item('近 1 年回撤', pct(f.dd, 2), stTxt(f), stColor) +
      item('門檻' + (f.th.custom ? '（自訂）' : ''), `${pct(f.th.watch, 0)}｜${pct(f.th.target, 0)}`, `觀察｜達標線 ${pct(f.th.target, 0)}／${pct(f.th.target * 2, 0)}／${pct(f.th.target * 3, 0)}`) +
      item('年線乖離', f.bias == null ? '資料不足' : pct(f.bias, 2), '對 240 日均線') +
      item('趨勢', TREND_TXT[f.trend], '60 日 vs 240 日均線');
    const lvRows = [['觀察', f.th.watch, f.status !== 'ok']];
    for (let L = 1; L <= LEVELS; L++) lvRows.push([`達標${CIRCLE[L]}`, f.th.target * L, f.level >= L]);
    $('m-desc').innerHTML = `近 1 年高點 <b>${f.hi.v}</b>（${f.hi.date}），目前 NAV <b>${f.last.v}</b>：<br>` +
      lvRows.map(([t, p, hit]) => `${hit ? '✅' : '⬜'} ${t}　${pct(p, 0)} → NAV 約 <b>${(f.hi.v * (1 + p)).toFixed(2)}</b>`).join('<br>') +
      `<br><span style="color:var(--dim)">門檻可在 Google Sheet「監控門檻」分頁逐檔調整；達標線＝門檻 ×1、×2、×3。</span>`;
    $('m-extra').innerHTML = extraHtml(f);
    drawBigChart(f);
    $('detail-modal').classList.add('show');
  }

  function extraHtml(f) {
    const bt = f.bt;
    // 1. 歷史回測
    let h1 = `<div class="m-sec"><h4>📈 歷史回測：跌破 ${pct(bt.T, 0)} 之後<small>資料約 ${f.years.toFixed(1)} 年</small></h4>`;
    if (!bt.done) {
      h1 += bt.events ? `這是資料期間內第 ${bt.events} 次跌破，之前沒有走完 3 個月的案例可以統計。` : `資料期間內沒有跌破過 ${pct(bt.T, 0)}，無法回測。`;
    } else {
      h1 += `<table class="bt"><thead><tr><th>持有</th><th>樣本</th><th>上漲機率</th><th>平均報酬</th><th>最差</th></tr></thead><tbody>` +
        bt.stats.map((x) => x.n ? `<tr><td>${x.m} 個月後</td><td>${x.n}</td><td>${x.up}/${x.n}（${Math.round(x.up / x.n * 100)}%）</td><td class="${x.avg >= 0 ? 'up' : 'down'}">${pct(x.avg)}</td><td class="${x.min >= 0 ? 'up' : 'down'}">${pct(x.min)}</td></tr>`
          : `<tr><td>${x.m} 個月後</td><td colspan="4" class="na">資料還不夠長</td></tr>`).join('') + '</tbody></table>' +
        `<div style="margin-top:6px">跌破後一年內最多再跌：平均 <b class="down">${pct(bt.dropAvg)}</b>、最深 <b class="down">${pct(bt.dropMin)}</b>` +
        (bt.done < 5 ? '<br><span style="color:#fbbf24">⚠ 樣本少於 5 次，參考價值有限</span>' : '') + '</div>';
    }
    h1 += '<div style="color:var(--dim);font-size:.74rem;margin-top:4px">以這檔基金自己的 NAV 計算，不含配息；回升到門檻一半以上才算下一次跌破。過去表現不代表未來。</div></div>';
    // 2. 止跌
    const s = f.stab;
    const h2 = `<div class="m-sec"><h4>🛑 止跌檢查<small class="stab s${s.score}">${s.score}/4 成立</small></h4><div class="chk">` +
      s.checks.map(([t, ok, d]) => `<span>${ok ? '✅' : '⬜'} ${t}<small>${d}</small></span>`).join('') + '</div>' +
      `<div style="color:var(--dim);font-size:.74rem;margin-top:4px">近 60 筆最低 NAV ${s.low}。跌到達標線＋止跌條件成立越多，越不容易買在半山腰。</div></div>`;
    // 3. 大盤＋4. 歷史位置
    const rows = benches.map((b) => { const r = benchDD(b, f.last.ts); return r ? `<tr><td>${esc(b.name)}</td><td class="${r.dd < -0.005 ? 'down' : ''}">${pct(r.dd)}</td><td>${r.date}</td></tr>` : ''; }).join('');
    const spy = benches.find((b) => b.name === 'SPY'), sd = spy ? benchDD(spy, f.last.ts) : null;
    let judge = '';
    if (sd) {
      const diff = f.dd - sd.dd;
      judge = diff <= -0.1 ? '這檔明顯比大盤跌得深，可能是產業或基金本身的因素，再跌風險較高。'
        : diff <= -0.03 ? '這檔比大盤跌得深一些。' : '和大盤的回撤差不多，偏向市場整體的修正。';
    }
    const h3 = `<div class="m-sec"><h4>🌐 大盤對照與歷史位置</h4>` +
      (rows ? `<table class="bt"><thead><tr><th>同期</th><th>近 1 年回撤</th><th>資料日期</th></tr></thead><tbody><tr><td>這檔基金</td><td class="${f.dd < -0.005 ? 'down' : ''}">${pct(f.dd)}</td><td>${f.last.date}</td></tr>${rows}</tbody></table>` +
        (judge ? `<div style="margin-top:6px">${judge}</div>` : '') : '<div class="na">資料中沒有 SPY／006208 可以對照。</div>') +
      `<div style="margin-top:6px">${f.years < 1 ? '歷史資料不到 1 年，暫不計算歷史位置。'
        : f.dd > -0.005 ? `目前在近 1 年高點附近。歷史最大回撤 ${pct(f.maxDD)}。`
        : `目前回撤 ${pct(f.dd)}，${f.pctl < 0.005 ? '是資料期間內<b>最深</b>的一次；' : `歷史上有 <b>${Math.round(f.pctl * 100)}%</b> 的日子跌得這麼深或更深${f.pctl <= 0.1 ? '，相當少見' : ''}；`}歷史最大回撤 ${pct(f.maxDD)}（資料約 ${f.years.toFixed(1)} 年）。`}</div></div>`;
    return h1 + h2 + h3;
  }

  function drawBigChart(f) {
    if (typeof Chart === 'undefined') return;
    const n = Math.min(f.pts.length, 250), s = f.pts.length - n;
    const pts = f.pts.slice(s), vals = f.vals.slice(s);
    const hiRoll = rollingMax(f.vals, HIGH_WINDOW).slice(s);
    const ds = (label, data, color, extra) => Object.assign({ label, data, borderColor: color, borderWidth: 1.5, pointRadius: 0, tension: 0.1, spanGaps: true }, extra || {});
    const datasets = [ds('NAV', vals, '#e2e8f0', { borderWidth: 2 })];
    if (f.ma60.some((v) => v != null)) datasets.push(ds('60 日均線', f.ma60.slice(s), '#60a5fa'));
    if (f.ma240.some((v) => v != null)) datasets.push(ds('240 日均線', f.ma240.slice(s), '#a78bfa', { borderDash: [5, 5], borderWidth: 1.2 }));
    datasets.push(ds(`觀察線 ${pct(f.th.watch, 0)}`, hiRoll.map((h) => h * (1 + f.th.watch)), '#eab308', { borderDash: [3, 3], borderWidth: 1 }));
    ['#10b981', '#0ea5a4', '#0891b2'].forEach((c, i) => {
      const p = f.th.target * (i + 1);
      datasets.push(ds(`達標${CIRCLE[i + 1]} ${pct(p, 0)}`, hiRoll.map((h) => h * (1 + p)), c, { borderDash: [6, 4], borderWidth: 1.2 }));
    });
    if (bigChart) bigChart.destroy();
    bigChart = new Chart($('big-chart').getContext('2d'), {
      type: 'line',
      data: { labels: pts.map((p) => p.date), datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 14, font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#64748b', maxTicksLimit: 6, maxRotation: 0 }, grid: { display: false } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
        }
      }
    });
  }

  // ---------- 載入 ----------
  async function loadThresholds() {
    const cached = ls.get(TH_CACHE_KEY);
    if (cached) { try { applyThresholds(JSON.parse(cached)); } catch (e) {} }
    try {
      const res = await fetch(`${API_URL}?op=get_thresholds`);
      const j = await res.json();
      if (j && j.default) { applyThresholds(j); ls.set(TH_CACHE_KEY, JSON.stringify(j)); return true; }
    } catch (e) {}
    return false;
  }
  function applyThresholds(j) {
    const d = j.default || {};
    thresholds.def = { watch: d.watch != null ? d.watch : DEFAULT_TH.watch, target: d.target != null ? d.target : DEFAULT_TH.target };
    thresholds.funds = j.funds || {};
  }

  function useData(json, label) {
    const newest = processData(json.headers, json.data);
    render();
    return newest;
  }

  async function init() {
    const status = $('status-display'), loading = $('loading');
    let hasCache = false;
    const thPromise = loadThresholds();
    const cached = ls.get(CACHE_KEY);
    if (cached) {
      try {
        const j = JSON.parse(cached);
        if (j.data && j.timestamp) {
          rawCache = j; useData(j); hasCache = true;
          status.innerHTML = `⚡ 快取資料（${Math.floor((Date.now() - j.timestamp) / 60000)} 分鐘前）・背景更新中…`;
        }
      } catch (e) {}
    }
    if (!hasCache) { loading.style.display = 'block'; status.textContent = ''; }

    let json;
    try {
      const res = await fetch(`${API_URL}?op=get_db_monitor`);
      json = await res.json();
      if (json.error) throw new Error(json.error);
      if (!json.headers || !json.data) throw new Error('回傳格式不正確');
    } catch (err) {
      loading.style.display = 'none';
      if (!hasCache) $('dashboard').innerHTML = `<div class="empty-state">❌ 連線失敗：${esc(err.message)}</div>`;
      else status.textContent = `⚠️ 更新失敗（顯示快取資料）・${err.message}`;
      return;
    }
    await thPromise;
    json.timestamp = Date.now();
    rawCache = json;
    const cachedOk = ls.set(CACHE_KEY, JSON.stringify(json));   // 資料太大存不進去也沒關係，只是下次沒有快取
    const newest = useData(json);
    loading.style.display = 'none';
    const d = new Date(newest);
    status.textContent = `✅ 已更新 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}・最新 NAV ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` + (cachedOk ? '' : '・（資料量大，未存快取）');
  }

  async function manualUpdate() {
    if (!confirm('確定要手動觸發後端更新嗎？\n\n會請後端去抓最新淨值，約需 15～30 秒。')) return;
    const loading = $('loading'), btn = $('btn-update');
    loading.style.display = 'block';
    loading.innerHTML = '📡 正在更新淨值，請稍候…';
    btn.style.opacity = '.5'; btn.style.pointerEvents = 'none';
    try {
      const res = await fetch(`${API_URL}?op=manual_update`);
      const j = await res.json();
      if (j.status !== 'success') throw new Error(j.message || '未知錯誤');
      $('update-msg').textContent = j.message || '更新完成';
      $('update-list').innerHTML = (j.details && j.details.length)
        ? j.details.map((it) => `<div class="result-item"><b>${esc(it.name)}</b><span><span class="r-nav">${esc(it.nav)}</span><span class="r-date">${esc(it.date)}</span></span></div>`).join('')
        : '<div style="text-align:center;color:var(--dim);padding:20px">本次沒有擷取到新資料</div>';
      $('update-modal').classList.add('show');
    } catch (err) {
      alert('❌ 更新失敗：\n' + err.message);
    } finally {
      loading.style.display = 'none'; loading.textContent = '📡 正在連線資料庫...';
      btn.style.opacity = '1'; btn.style.pointerEvents = 'auto';
    }
  }

  function forceReload() { ls.del(CACHE_KEY); ls.del(TH_CACHE_KEY); init(); }

  // ---------- 事件 ----------
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; state.filter = b.dataset.f; render(); });
  $('search').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.querySelectorAll('.view-btn').forEach((b) => b.addEventListener('click', () => { state.view = b.dataset.view; ls.set('fund_radar_view', state.view); render(); }));
  $('btn-update').addEventListener('click', manualUpdate);
  $('btn-refresh').addEventListener('click', forceReload);
  document.querySelectorAll('.modal-backdrop').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) closeModal(m.id); }));
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeModal(b.dataset.close)));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop.show').forEach((m) => closeModal(m.id)); });
  function closeModal(id) {
    $(id).classList.remove('show');
    if (id === 'update-modal') forceReload();
  }

  init();
})();
</script>
</body>
</html>
