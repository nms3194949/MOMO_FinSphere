  // ===== 類型 =====

  function classify(a) {
    const risk = { sell: 0, half: 1, hold: 2, buy: 3 }[a.drop] ?? 1;
    const exp = { none: 0, stock: 1, fund: 2, all: 3 }[a.exp] ?? 1;
    if (exp === 0 && risk <= 1) return 'explore';
    if (a.goal === 'unsure' && exp <= 1) return 'explore';
    if (a.care === 'principal' || risk === 0 || (a.care === 'liquid' && risk <= 1)) return 'guard';
    if ((a.care === 'growth' || a.goal === 'grow' || a.goal === 'edu') && risk >= 2 && (a.when === '10to20' || a.when === 'gt20')) return 'grow';
    if (a.care === 'income' && risk <= 2) return 'stream';
    if ((a.goal === 'retire' || a.goal === 'passive') && risk <= 1) return 'stream';
    return 'balance';
  }

  function bind(q) {
    const back = $('back'); if (back) back.onclick = () => { S.i--; ask(); };

  // ===== 結果 =====
  function annuity(m, r, years) { const i = r / 12, n = years * 12; return m * (1 - Math.pow(1 + i, -n)) / i; }

      $('sendLine').onclick = () => { track('line_click', { link_location: 'money_map_send', persona: key }); send({ action: 'line_send' }); $('n2').classList.add('done'); $('n2').textContent = '✓'; };
      $('contactForm').onsubmit = (e) => {

  }

  // ===== 存成圖片（1080×1350，適合 IG 貼文／限動） =====
  function wrap(ctx, text, maxW) {
    const out = []; let line = '';
    for (const ch of text) { if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch; }
    if (line) out.push(line); return out;
  }
  function saveCard(p) {
    const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, p.color[0]); g.addColorStop(1, p.color[1]);
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.14)';
    x.beginPath(); x.arc(W - 80, 120, 300, 0, Math.PI * 2); x.fill();
    x.beginPath(); x.arc(60, H - 60, 220, 0, Math.PI * 2); x.fill();
    const F = '"Noto Sans TC", "PingFang TC", sans-serif';
    x.fillStyle = '#fff'; x.textAlign = 'left';
    x.font = `700 36px ${F}`; x.fillText('現金流人生地圖｜我的類型', 90, 150);
    x.font = `200px ${F}`; x.fillText(p.emoji, 80, 420);
    x.font = `900 120px ${F}`; x.fillText(p.name, 90, 580);
    x.font = `700 44px ${F}`;
    wrap(x, p.line, W - 180).forEach((l, k) => x.fillText(l, 90, 680 + k * 66));
    let tx = 90, ty = 900; x.font = `700 38px ${F}`;
    p.traits.concat(label('goal', S.a.goal)).forEach((t) => {
      const s = '#' + t, w = x.measureText(s).width + 56;
      if (tx + w > W - 90) { tx = 90; ty += 92; }
      x.fillStyle = 'rgba(255,255,255,.22)'; roundRect(x, tx, ty - 50, w, 72, 36); x.fill();
      x.fillStyle = '#fff'; x.fillText(s, tx + 28, ty); tx += w + 18;
    });
    x.font = `700 40px ${F}`; x.fillStyle = 'rgba(255,255,255,.9)';
    x.fillText('你是哪一種？測測看 👉 momowinwin.com/map', 90, H - 110);
    c.toBlob((blob) => {
      if (!blob) return toast('存圖失敗，請直接截圖');
      const file = new File([blob], `現金流類型-${p.name}.png`, { type: 'image/png' });
      track('quiz_share', { tool: 'money_map', persona: S.key });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: `我是${p.name}`, text: '你是哪一種現金流人？' }).catch(() => {});
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('圖片已下載 📸');
      }
    }, 'image/png');
  }
